<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Speed-Skydive Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% if needs_plotly %}
    <script src="/plotly.min.js"></script>
    <script>
        window.showPlotlyLoadError = function () {
            document.querySelectorAll(".chart").forEach(function (el) {
                el.innerHTML = '<div class="chart-error">Plotly konnte nicht geladen werden. Bitte Seite neu laden.</div>';
            });
        };
    </script>
    {% endif %}
</head>
<body>
{% set vm = view_mode if view_mode in ["simple", "expert"] else "expert" %}
<header class="topbar">
    <div class="container topbar-inner">
        <a class="brand" href="/?view={{ vm }}">Speed-Skydive Analyzer</a>
        <nav class="nav">
            <a href="/?view={{ vm }}">Upload</a>
            {% if coach_view_enabled %}
            <a href="/coach?view={{ vm }}">Traineransicht</a>
            {% endif %}
        </nav>
    </div>
</header>
<main class="container page">
    {% block content %}{% endblock %}
</main>
</body>
</html>
