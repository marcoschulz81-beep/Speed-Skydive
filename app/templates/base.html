<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Speed-Skydive Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
{% set vm = view_mode if view_mode in ["simple", "expert"] else "expert" %}
<header class="topbar">
    <div class="container topbar-inner">
        <a class="brand" href="/?view={{ vm }}">Speed-Skydive Analyzer</a>
        <nav class="nav">
            <a href="/?view={{ vm }}">Upload</a>
            {% if coach_view_enabled %}
            <a href="/coach?view={{ vm }}">Traineransicht</a>
            {% endif %}
        </nav>
    </div>
</header>
<main class="container page">
    {% block content %}{% endblock %}
</main>
</body>
</html>
